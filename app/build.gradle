plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.ichef.staff'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.ichef.staff'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // IMPORTANT : signer avec votre propre clé privée AVANT diffusion.
            minifyEnabled false
        }
    }
}
