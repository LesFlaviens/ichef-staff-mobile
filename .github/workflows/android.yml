name: iCHEF Staff Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler iCHEF Staff
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compiler APK Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: iCHEF-Staff-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
