Le chef saisit un produit, par exemple Saumon mariné.
iCHEF recherche automatiquement sa durée de conservation dans le référentiel PMS validé de l’établissement.
Le système calcule la DLC à partir de la date et de l’heure de préparation.
La DLC apparaît directement sur l’étiquette, sans saisie manuelle.
Le chef vérifie les informations, peut modifier la date et valide l’étiquette.

Important : si aucune durée validée n’existe pour le produit, iCHEF propose au chef de l’enregistrer une première fois. Ensuite, le calcul devient automatique. L’IA ne doit pas inventer une durée de conservation pour un produit alimentaire.

