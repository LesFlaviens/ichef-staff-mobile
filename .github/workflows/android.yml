name: iCHEF Staff Android RELEASE signée (administrateur)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android 35 et Build Tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK release non signée
        run: gradle --no-daemon :app:assembleRelease
      - name: Signer et vérifier l'APK release
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ICHEF_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ICHEF_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ICHEF_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ICHEF_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo 'Secrets de signature release manquants'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ichef-staff-release.jks"
          mkdir -p dist
          ANDROID_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          "$ANDROID_TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/ichef-staff-aligned.apk
          "$ANDROID_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/ichef-staff-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEY_PASS \
            --out dist/ichef-staff.apk dist/ichef-staff-aligned.apk
          "$ANDROID_TOOLS/apksigner" verify --verbose dist/ichef-staff.apk
          "$ANDROID_TOOLS/apksigner" verify --print-certs dist/ichef-staff.apk
          rm -f dist/ichef-staff-aligned.apk "$RUNNER_TEMP/ichef-staff-release.jks"
      - name: Télécharger l'APK signé (administrateur seulement)
        uses: actions/upload-artifact@v4
        with:
          name: iCHEF-Staff-RELEASE-signee
          path: dist/ichef-staff.apk
          if-no-files-found: error
          retention-days: 14
